<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runway Studio</title>
<style>
:root{--bg:#fff;--fg:#14171a;--mut:#667;--card:#f4f5f7;--acc:#2b59ff;--bd:#d9dce1}
@media(prefers-color-scheme:dark){:root{--bg:#111316;--fg:#e8eaed;--mut:#9aa;--card:#1c1f24;--bd:#2d3138}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px;display:grid;gap:16px}
h1{font-size:20px;margin:0}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.tabs button{background:none;border:0;color:var(--mut);padding:6px 12px;cursor:pointer;font:inherit}
.tabs button.on{color:var(--fg);border-bottom:2px solid var(--acc)}
label{display:block;margin:8px 0 3px;color:var(--mut);font-size:13px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
textarea{font-family:ui-monospace,monospace;min-height:220px}
button.go{margin-top:12px;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:9px 18px;font:inherit;cursor:pointer}
.job{margin-top:10px}.st{font-family:ui-monospace,monospace;font-size:13px}.err{color:#d33}
img,video{max-width:100%;border-radius:8px;margin-top:6px}

#ob{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto;display:none}
#ob.on{display:block}.ob-in{max-width:560px;margin:0 auto;padding:32px 16px}
.dots{display:flex;gap:6px;margin-bottom:24px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--bd)}.dots i.on{background:var(--acc)}
.ob-in h2{margin:0 0 8px}.ob-in p{color:var(--mut);line-height:1.5}
.opts{display:grid;gap:8px;margin:14px 0}.opt{padding:12px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;background:var(--card)}
.opt.sel{border-color:var(--acc);outline:1px solid var(--acc)}.row{display:flex;gap:8px;justify-content:space-between;margin-top:18px}
button.ghost{background:none;border:1px solid var(--bd);color:var(--fg);border-radius:6px;padding:9px 18px;font:inherit;cursor:pointer}
a{color:var(--acc)}
</style></head><body><div id="ob"><div class="ob-in"><div class="dots" id="dots"></div><div id="obbody"></div></div></div>
<main>
<h1>Runway Studio</h1><a href="#" id="redo" style="font-size:13px">Re-run setup</a>
<div class="card">
 <div class="tabs"><button id="t1" class="on">Quick generate</button><button id="t2">Script</button></div>
 <div id="quick">
  <label>Type</label><select id="type"></select>
  <label>Prompt</label><textarea id="prompt" style="min-height:70px;font-family:inherit"></textarea>
  <label>Extra params (JSON, e.g. {"promptImage":"https://…","duration":10})</label>
  <input id="extra" value="{}">
 </div>
 <div id="scr" hidden>
  <label>YAML or JSON script — use {{id.output}} to chain steps</label>
  <textarea id="script"></textarea>
 </div>
 <button class="go" id="go">Run</button> <span id="msg" class="err"></span>
</div>
<div id="jobs"></div>
</main>
<script>
const $=i=>document.getElementById(i);
$('script').value=`name: demo
steps:
  - id: still
    type: text_to_image
    promptText: a lighthouse at dusk, cinematic
  - id: clip
    type: image_to_video
    promptImage: "{{still.output}}"
    promptText: waves crash, slow push in
    duration: 5
`;
fetch('/api/kinds').then(r=>r.json()).then(k=>{$('type').innerHTML=Object.keys(k).map(x=>`<option>${x}</option>`).join('')});
$('redo').onclick=e=>{e.preventDefault();ob.step=0;$('ob').className='on';obRender()};
let mode='quick';
function tab(m){mode=m;$('quick').hidden=m!='quick';$('scr').hidden=m=='quick';$('t1').className=m=='quick'?'on':'';$('t2').className=m=='quick'?'':'on'}
$('t1').onclick=()=>tab('quick');$('t2').onclick=()=>tab('script');
$('go').onclick=async()=>{
 $('msg').textContent='';let body;
 try{body=mode=='quick'?{type:$('type').value,params:{...(($('prompt').value)?{promptText:$('prompt').value}:{}),...JSON.parse($('extra').value||'{}')}}:{script:$('script').value}}
 catch(e){$('msg').textContent='Bad JSON: '+e.message;return}
 const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok){$('msg').textContent=(await r.json()).detail;return}
 poll((await r.json()).id);
};
function media(u){return /\.(mp4|webm|mov)(\?|$)/i.test(u)?`<video src="${u}" controls></video>`:/\.(mp3|wav)(\?|$)/i.test(u)?`<audio src="${u}" controls></audio>`:`<img src="${u}">`}
async function poll(id){
 let el=document.getElementById('j'+id);
 if(!el){el=document.createElement('div');el.id='j'+id;el.className='card job';$('jobs').prepend(el)}
 const j=await (await fetch('/api/jobs/'+id)).json();
 el.innerHTML=`<b>Job ${id}</b> — ${j.status}`+(j.error?` <span class="err">${j.error}</span>`:'')+
  Object.entries(j.steps).map(([s,v])=>`<div class="st">${s}: ${v.status}${v.detail!=null&&v.status!='DONE'?' '+v.detail:''}</div>`+(v.output||[]).map(media).join('')).join('');
 if(j.status=='RUNNING')setTimeout(()=>poll(id),3000);
}

const GOALS={text_to_image:['Make images','Turn a text description into a picture','a cozy cabin in a snowy forest at dusk, cinematic lighting'],
 text_to_video:['Make videos from text','Describe a scene and get a short clip','a paper boat drifting down a rain-soaked street, slow tracking shot'],
 image_to_video:['Animate a photo','Bring a still image to life (you paste an image link)','gentle camera push-in, soft wind']};
let ob={step:0,goal:'text_to_image'};
const N=4;
function obRender(){
 $('dots').innerHTML=[...Array(N)].map((_,i)=>`<i class="${i<=ob.step?'on':''}"></i>`).join('');
 const b=$('obbody'),back=ob.step>0?'<button class="ghost" id="obb">Back</button>':'<span></span>';
 if(ob.step==0)b.innerHTML=`<h2>Welcome to Runway Studio</h2><p>This takes about two minutes. You'll connect your Runway account, pick what you want to make, and generate your first result. Nothing is charged by this app; generations use credits on your own Runway account.</p><div class="row"><span></span><button class="go" id="obn">Get started</button></div>`;
 if(ob.step==1)b.innerHTML=`<h2>Connect your Runway account</h2><p>You need an API key.</p><ol style="color:var(--mut);line-height:1.6"><li>Go to <a href="https://dev.runwayml.com" target="_blank" rel="noopener">dev.runwayml.com</a> and sign in.</li><li>Create an organization, add credits, and create an API key.</li><li>Paste it below. It's saved only on this computer.</li></ol><input id="obkey" type="password" placeholder="key_…" autocomplete="off"><div id="obmsg" class="err" style="margin-top:8px"></div><div class="row">${back}<button class="go" id="obn">Verify &amp; continue</button></div>`;
 if(ob.step==2)b.innerHTML=`<h2>What do you want to make first?</h2><div class="opts">${Object.entries(GOALS).map(([k,v])=>`<div class="opt ${k==ob.goal?'sel':''}" data-k="${k}"><b>${v[0]}</b><br><span style="color:var(--mut)">${v[1]}</span></div>`).join('')}</div><div class="row">${back}<button class="go" id="obn">Continue</button></div>`;
 if(ob.step==3){const g=GOALS[ob.goal];b.innerHTML=`<h2>Try your first generation</h2><p>Edit the prompt, then run it. It usually takes under a minute for images and a few minutes for video.</p><textarea id="obp" style="min-height:80px;font-family:inherit">${g[2]}</textarea>${ob.goal=='image_to_video'?'<label>Image link (https://…)</label><input id="obimg">':''}<div id="obmsg" class="err" style="margin-top:8px"></div><div id="obres"></div><div class="row">${back}<button class="go" id="obn">Generate</button></div>`}
 if(b.querySelector('#obb'))$('obb').onclick=()=>{ob.step--;obRender()};
 b.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ob.goal=o.dataset.k;obRender()});
 $('obn').onclick=obNext;
}
async function obNext(){
 const m=$('obmsg');if(m)m.textContent='';
 if(ob.step==1){
  const r=await fetch('/api/setup/key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:$('obkey').value})});
  const j=await r.json();if(!r.ok){m.textContent=j.detail;return}
  ob.credits=j.credits;
 }
 if(ob.step==3){
  if($('obn').dataset.done){await fetch('/api/setup/done',{method:'POST'});$('ob').className='';return}
  const params={promptText:$('obp').value};if(ob.goal=='image_to_video'){if(!$('obimg').value){m.textContent='Paste an image link first';return}params.promptImage=$('obimg').value}
  $('obn').disabled=true;$('obn').textContent='Generating…';
  const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:ob.goal,params})});
  const j=await r.json();if(!r.ok){m.textContent=j.detail;$('obn').disabled=false;$('obn').textContent='Generate';return}
  for(;;){await new Promise(x=>setTimeout(x,3000));const jj=await (await fetch('/api/jobs/'+j.id)).json();
   if(jj.status=='DONE'){$('obres').innerHTML=Object.values(jj.steps).flatMap(v=>v.output||[]).map(media).join('');$('obn').disabled=false;$('obn').textContent="Finish — open Studio";$('obn').dataset.done=1;return}
   if(jj.status=='FAILED'){m.textContent=jj.error;$('obn').disabled=false;$('obn').textContent='Try again';return}}
 }
 ob.step++;obRender();
}
fetch('/api/setup/status').then(r=>r.json()).then(s=>{if(!s.has_key||!s.onboarded){ob.step=s.has_key?2:0;$('ob').className='on';obRender()}});
</script></body></html>
